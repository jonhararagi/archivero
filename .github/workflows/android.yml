name: Android build
on:
  push:
    branches: [main, feature/archivero-android-file-manager]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    needs: compatibility-smoke
    runs-on: ubuntu-latest
    env:
      ARCHIVERO_CI_DEBUG_KEYSTORE: /home/runner/.android/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Restore stable CI debug signing key
        uses: actions/cache@v4
        with:
          path: /home/runner/.android/debug.keystore
          key: archivero-ci-debug-keystore-v1
      - name: Ensure CI debug signing key exists
        shell: bash
        run: |
          key="/home/runner/.android/debug.keystore"
          mkdir -p "$(dirname "$key")"
          if [ ! -s "$key" ]; then
            keytool -genkeypair -noprompt -keystore "$key" -storetype JKS \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -keystore "$key" -storetype JKS \
            -storepass android -alias androiddebugkey >/dev/null
          echo "CI debug signing key is ready."
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Run local unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - name: Verify APK signature and create SHA-256
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          key="$ARCHIVERO_CI_DEBUG_KEYSTORE"
          test -s "$apk"
          test -s "$key"
          key_cert="$(keytool -exportcert -keystore "$key" -storepass android -alias androiddebugkey | sha256sum | cut -d' ' -f1)"
          apk_cert="$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          echo "Keystore certificate SHA-256: $key_cert"
          echo "APK signer SHA-256: $apk_cert"
          test -n "$apk_cert"
          test "$key_cert" = "$apk_cert"
          sha256sum "$apk" > "$apk.sha256"
          cat "$apk.sha256"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: archivero-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk*
          if-no-files-found: error

  compatibility-smoke:
    name: Android API ${{ matrix.api-level }} compatibility smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - api-level: 26
            target: default
          - api-level: 35
            target: aosp_atd
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          accept-android-sdk-licenses: true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Run on Android API ${{ matrix.api-level }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: ${{ matrix.target }}
          profile: pixel_2
          disable-animations: true
          script: bash -c 'set +e; gradle --no-daemon connectedDebugAndroidTest; test_status=$?; if [ "$test_status" -ne 0 ]; then mkdir -p build/emulator-diagnostics; adb devices -l > build/emulator-diagnostics/api-${{ matrix.api-level }}-devices.txt 2>&1 || true; adb logcat -d -b all > build/emulator-diagnostics/api-${{ matrix.api-level }}-logcat.txt 2>&1 || true; adb shell dumpsys activity activities > build/emulator-diagnostics/api-${{ matrix.api-level }}-activities.txt 2>&1 || true; adb shell dumpsys cpuinfo > build/emulator-diagnostics/api-${{ matrix.api-level }}-cpuinfo.txt 2>&1 || true; adb shell top -b -n 1 > build/emulator-diagnostics/api-${{ matrix.api-level }}-top.txt 2>&1 || true; adb shell dumpsys package com.jonhararagi.archivero.test > build/emulator-diagnostics/api-${{ matrix.api-level }}-test-package.txt 2>&1 || true; fi; exit "$test_status"'
      - name: Upload emulator diagnostics when tests fail
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-${{ matrix.api-level }}-diagnostics
          path: build/emulator-diagnostics/**
          if-no-files-found: ignore
          retention-days: 7
